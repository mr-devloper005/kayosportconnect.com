services:
  ks5x9q2m4v:
    container_name: ks5x9q2m4v_app
    image: ghcr.io/mr-devloper005/kayosportconnect.com:latest
    env_file:
      - .env
    network_mode: bridge
    restart: always
    ports:
      - "127.0.0.1:3089:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5m
      timeout: 3s
      retries: 2
